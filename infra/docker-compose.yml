# Canopy — local container run.
#
# Next.js-only architecture: no Postgres (search is in-memory). The web image
# is built from the repo root (pnpm workspace), so the build context is `..`.
#
#   cp infra/.env.example infra/.env   # then fill in vault + AWS values
#   docker compose -f infra/docker-compose.yml up --build
#
# NOTE: the app has no authentication by default. Either enable the built-in
# OIDC gate (AUTH_MODE=oidc — see docs/configuration.md; an optional local
# Keycloak is commented out at the bottom of this file), or only expose port
# 3000 on trusted networks / put an authenticating reverse proxy in front.

services:
  web:
    build:
      # Repo root context — the pnpm workspace lockfile lives there
      context: ..
      dockerfile: web/Dockerfile
    ports:
      - "3000:3000"
    # Vault config + feature flags. The code already defaults to
    # agent-on / processing-off, so flags are optional here.
    env_file: .env
    # AWS credentials for S3 + Bedrock. Prefer env vars in .env, or mount a
    # read-only profile instead (uncomment below and remove the keys in .env):
    # volumes:
    #   - ~/.aws:/home/node/.aws:ro
    # environment:
    #   AWS_PROFILE: default
    restart: unless-stopped

  # Optional local Keycloak for trying the built-in OIDC gate without standing
  # up an IdP by hand. Uncomment, then:
  #   1. start it, open http://localhost:8080 (admin/admin), create a realm
  #      `canopy` and a confidential client `canopy` with redirect URI
  #      http://localhost:3000/api/auth/callback and post-logout http://localhost:3000/
  #   2. add these to infra/.env (see docs/configuration.md → Authentication):
  #        AUTH_MODE=oidc
  #        OIDC_ISSUER=http://localhost:8080/realms/canopy
  #        OIDC_CLIENT_ID=canopy
  #        OIDC_CLIENT_SECRET=<from Keycloak>
  #        AUTH_SESSION_SECRET=<openssl rand -hex 32>
  #        AUTH_ALLOWED_EMAILS=you@example.com
  # keycloak:
  #   image: quay.io/keycloak/keycloak:26.0
  #   command: start-dev
  #   environment:
  #     KC_BOOTSTRAP_ADMIN_USERNAME: admin
  #     KC_BOOTSTRAP_ADMIN_PASSWORD: admin
  #   ports:
  #     - "8080:8080"
  #   restart: unless-stopped
