name: Release image

# Builds the web image, scans it with Trivy, and publishes it to GitHub
# Container Registry as ghcr.io/<owner>/<repo>. The image name follows the
# repository automatically, so a repo rename needs no workflow change.
#
# Two variants are published from the same Dockerfile (matrix over base path):
#   root  — served at "/"      (no tag suffix)
#   wiki  — served under "/wiki" (NEXT_BASE_PATH=/wiki baked in, "-wiki" suffix)
#
# `basePath` is a Next.js build-time setting, so the sub-path image MUST be
# built with the build-arg — setting NEXT_BASE_PATH at runtime has no effect
# and leaves assets at /_next/ instead of /wiki/_next/. See
# docs/configuration.md#serving-under-a-sub-path-base-path.
#
# Tags published (per variant; <suffix> is "" for root, "-wiki" for wiki):
#   latest<suffix>          — every push to main
#   vX.Y.Z<suffix> / X.Y<suffix> — on version tags (git tag v1.2.3 && git push --tags)
#   sha-<short><suffix>     — every published build, for exact rollbacks
#
# Publishing is restricted to the main branch: the workflow only runs on
# pushes to main, version tags, or a manual dispatch — never on PR branches.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  image:
    name: build / scan / push (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Root-path image — served at "/".
          - variant: root
            base_path: ""
            tag_suffix: ""
          # Sub-path image — served under "/wiki". basePath is baked in at build
          # time so the portal's chunks resolve at /wiki/_next/... behind an
          # ingress that routes /wiki to the app (without stripping the prefix).
          - variant: wiki
            base_path: "/wiki"
            tag_suffix: "-wiki"
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + OCI labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Suffix every tag for the sub-path variant (latest -> latest-wiki,
          # v1.2.3 -> v1.2.3-wiki, ...). onlatest applies it to `latest` too.
          flavor: |
            suffix=${{ matrix.tag_suffix }},onlatest=true
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.title=Vaultmark
            org.opencontainers.image.description=S3-backed Markdown knowledge portal

      # Build the native-arch image locally first so Trivy can scan exactly
      # what we are about to publish. The gha cache makes the multi-arch
      # build below reuse these layers.
      - name: Build amd64 image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          file: web/Dockerfile
          load: true
          tags: vaultmark-scan-target:ci${{ matrix.tag_suffix }}
          build-args: |
            NEXT_BASE_PATH=${{ matrix.base_path }}
          # Scope the cache per variant — root and wiki produce different chunk
          # URLs, so a shared cache would cross-contaminate the build output.
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      # Gate publishing on the scan: fixable HIGH/CRITICAL vulns fail the job.
      # (SARIF upload to the Security tab needs GitHub code scanning, which is
      # free once the repo is public — switch format to 'sarif' then.)
      - name: Trivy scan (vulnerabilities)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vaultmark-scan-target:ci${{ matrix.tag_suffix }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Push multi-arch image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_BASE_PATH=${{ matrix.base_path }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
