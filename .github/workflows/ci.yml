name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: web — typecheck / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from package.json `packageManager` (pnpm@10.5.0).
      # Do NOT add a `version:` input here — having both is an error in v4.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          # Workspace lockfile lives at the repo root
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          # Placeholder — route modules require a bucket at import time during
          # `next build`. Real deployments set this at runtime.
          VAULT_BUCKET: build-placeholder

  web-e2e:
    name: web — e2e (Playwright, mock S3)
    runs-on: ubuntu-latest
    # Playwright config and specs live at the repo root, not web/ — no
    # working-directory override here.
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from package.json `packageManager` (pnpm@10.5.0).
      # Do NOT add a `version:` input here — having both is an error in v4.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
        env:
          # e2e runs mock-backed (MOCK_S3=1 via playwright.config.ts); the
          # bucket is only needed so route modules import during `next build`.
          VAULT_BUCKET: build-placeholder
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  api:
    name: api — lint / typecheck / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --group dev

      - run: uv run ruff check app/ tests/

      - run: uv run pyright app/

      - run: uv run pytest tests/ -v
        env:
          VAULT_BUCKET: test-bucket
          VAULT_PREFIX: vault
          VAULT_REGION: us-east-1
          DATABASE_URL: postgresql+asyncpg://x:x@localhost/x
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
