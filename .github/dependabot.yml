# Dependabot — dependency update PRs + security alerts.
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # pnpm workspace (web, ingest, video) — lockfile at the repo root
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for routine minor/patch bumps; majors stay individual
      minor-and-patch:
        update-types: [minor, patch]
    # Framework pins are deliberate (see .kiro/steering/tech-stack.md) —
    # majors need a steering-doc update first, so don't auto-PR them.
    ignore:
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      # TS 7 is the native Go port: it drops the JS compiler API that
      # Next.js and typescript-eslint load. Revisit when typescript-eslint
      # supports TS >= 7.1 (typescript-eslint#10940).
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # ESLint 10 changed the rule context API; eslint-plugin-react (via
      # eslint-config-next 16.2) crashes on it. Revisit when
      # eslint-config-next ships ESLint 10 support.
      - dependency-name: eslint
        update-types: [version-update:semver-major]

  # Curate Lambda (own package.json, deployed out-of-band)
  - package-ecosystem: npm
    directory: /infra/lambda/curate
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Same TS 7 reasoning as the root workspace above — ts-jest loads the
    # JS compiler API that TS 7 no longer ships.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  # Archived FastAPI backend — CI still runs its tests, so keep it patched,
  # but monthly to limit noise on archived code.
  - package-ecosystem: uv
    directory: /api
    schedule:
      interval: monthly

  # Base images in Dockerfiles
  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: monthly

  # GitHub Actions pins
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
