[project]
name = "api"
version = "0.1.0"
description = "Vaultmark FastAPI backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.140.0",
    "uvicorn[standard]>=0.51.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.14.2",
    "boto3>=1.43.40",
    "python-frontmatter>=1.3.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "alembic>=1.18.5",
    "asyncpg>=0.30.0",
    "greenlet>=3.5.4",
    "rapidfuzz>=3.14.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.26.0",
    "httpx>=0.28.0",
    "moto[s3]>=5.2.2",
    "ruff>=0.16.0",
    "pyright>=1.1.410",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
